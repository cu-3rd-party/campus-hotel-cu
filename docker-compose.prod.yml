# Продакшен-конфиг. Отличия от docker-compose.yml (он для локальной разработки):
#   * наружу торчит только Caddy (80/443) — он же выдаёт HTTPS-сертификат;
#   * база и бэкенд портов наружу НЕ имеют, доступны только внутри сети compose;
#   * пароль базы и секреты берутся из .env, дефолтов нет;
#   * все сервисы перезапускаются сами.
#
# Запуск:
#   docker compose -p obshaga -f docker-compose.prod.yml --profile bot up -d --build
#
# Это отдельный файл, а не оверлей: в compose списки портов при слиянии
# складываются, поэтому «спрятать» порты из базового файла оверлеем нельзя.

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command: [ "--configFile=/etc/traefik/traefik.yml" ]
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./traefik:/etc/traefik:ro,Z
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obshaga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: obshaga
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U obshaga" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://obshaga:${POSTGRES_PASSWORD}@db:5432/obshaga
      UPLOAD_DIR: /app/uploads
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?задай TELEGRAM_BOT_TOKEN в .env}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?задай TELEGRAM_BOT_USERNAME в .env}
      BOT_SECRET: ${BOT_SECRET:?задай BOT_SECRET в .env}
      # Собирается из DOMAIN, чтобы адрес был задан ровно в одном месте.
      SITE_URL: https://${DOMAIN:?задай DOMAIN в .env}
      # Прокси до Telegram (уведомления, аватарки). Пусто — напрямую.
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      # Куда анонсировать новые анкеты. Пусто — лента выключена.
      TELEGRAM_MINIAPP_SHORT_NAME: ${TELEGRAM_MINIAPP_SHORT_NAME:-}
      TELEGRAM_FEED_CHAT_ID: ${TELEGRAM_FEED_CHAT_ID:-}
      TELEGRAM_FEED_THREAD_ID: ${TELEGRAM_FEED_THREAD_ID:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build: ./bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      BOT_SECRET: ${BOT_SECRET:?}
      API_URL: http://backend:8000
      SITE_URL: https://${DOMAIN:?}
      # Прокси до api.telegram.org для long polling. Пусто — напрямую.
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:80" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
