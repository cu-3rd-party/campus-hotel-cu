<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Соседи · Рядом</title>
    <meta name="description" content="Найди соседей по комнате в Диске и Облаке: познакомься, сравни привычки и собери комнату вместе."/>
    <link rel="icon" href="/identity/disk.svg" type="image/svg+xml"/>
    <script defer src="/telegram-web-app.js"></script>
    <script>
      // Применяем тему до отрисовки, чтобы не было вспышки светлого экрана.
      (function () {
        try {
          var mode = localStorage.getItem("obshaga_theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light"
          );
        } catch (e) {}
      })();
    </script>
    <script src="/hub-tracker.js" data-project="disk" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
