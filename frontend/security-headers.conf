# Telegram Web embeds this app; SAMEORIGIN X-Frame-Options would break them.
# The SDK inserts trusted theme CSS, hence inline styles; scripts remain strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob: data:; font-src 'self'; connect-src 'self' https://cu.vubni.ru https://telegram.org https://oauth.telegram.org; frame-src https://oauth.telegram.org https://telegram.org https://t.me; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://t.me; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
