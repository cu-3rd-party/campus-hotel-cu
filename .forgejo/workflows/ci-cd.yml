name: CI/CD

# Forgejo Actions (git.cu3rd.ru, раннер организации cu3rd).
# push в main: собрать образы и выкатить на dev.
# Prod — вручную: Actions → CI/CD → Run workflow (main) с галочкой deploy_prod.
# Деплой = смена образа в pxc1984/homelab, дальше Argo CD выкатывает сам
# (k3s, узел grm, namespace campus-hotel-<env>).
#
# Образы — в реестре Forgejo: git.cu3rd.ru/cu3rd/campus-hotel-cu-<service>
# (публичные, как и организация). Пушит служебный пользователь cu3rd-ci:
# переменная организации REGISTRY_USER и секрет организации REGISTRY_TOKEN.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: 'Deploy to prod (after dev)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        service: [ backend, frontend, bot ]
    env:
      IMAGE: git.cu3rd.ru/cu3rd/campus-hotel-cu-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      # Драйвер docker: сборка идёт в dockerd раннера, и слои кэшируются на его
      # томе между запусками (registry-кэш buildx не нужен).
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: git.cu3rd.ru
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-dev:
    name: Deploy to dev
    needs: build
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    uses: ./.forgejo/workflows/deploy.yml
    with:
      environment: dev
    secrets: inherit

  deploy-prod:
    name: Deploy to prod
    needs: deploy-dev
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    uses: ./.forgejo/workflows/deploy.yml
    with:
      environment: prod
    secrets: inherit
