name: Deploy

# Деплой через GitOps: образы уже в реестре git.cu3rd.ru, здесь только меняется образ
# в репозитории pxc1984/homelab на GitHub (apps/campus-hotel-<env>-{backend,frontend,bot}/values.yaml) —
# Argo CD сам выкатывает его в k3s. Конфигурация и секреты окружения живут там же (Sealed Secrets).
# Секрет репозитория HOMELAB_DEPLOY_KEY — deploy key с правом записи в pxc1984/homelab
# (один на dev и prod: окружений с отдельными секретами в Forgejo Actions нет).

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment name (dev or prod)'

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout homelab
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          repository: pxc1984/homelab
          ssh-key: ${{ secrets.HOMELAB_DEPLOY_KEY }}

      - name: Update images
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TAG: ${{ github.sha }}
        run: |
          stack="campus-hotel-${ENVIRONMENT}"
          for service in backend frontend bot; do
            values="apps/${stack}-${service}/values.yaml"
            if [ ! -f "$values" ]; then
              echo "::error::$values не найден в homelab"
              exit 1
            fi
            # repository тоже: при переезде с ghcr.io первый деплой переключает реестр
            sed -i -E \
              -e "s|^(  repository: ).*|\1git.cu3rd.ru/cu3rd/campus-hotel-cu-${service}|" \
              -e "s/^(  tag: )[^ ]+/\1${TAG}/" "$values"
          done
          git diff --exit-code && exit 0
          git config user.name "forgejo-actions[bot]"
          git config user.email "cu3rd-ci@noreply.git.cu3rd.ru"
          git commit -am "${stack}: deploy ${TAG::7}"
          # параллельный деплой другого приложения мог успеть запушить раньше
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
